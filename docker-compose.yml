services:
  n8n:
    image: n8nio/n8n:2.37.10
    container_name: document-classification-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Lisbon}
      - TZ=${TZ:-Europe/Lisbon}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./docker/n8n/entrypoint.sh:/custom-entrypoint.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        tr -d '\r' < /custom-entrypoint.sh > /tmp/custom-entrypoint.sh
        exec /bin/sh /tmp/custom-entrypoint.sh

volumes:
  n8n_data:
