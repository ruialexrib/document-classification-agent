version: "0.1.0"

settings:
  confidence_threshold: 0.80
  ambiguous_status: REVIEW

rules:
  - id: R001
    description: Não classificar com base apenas no nome do ficheiro.
  - id: R002
    description: O conteúdo do documento prevalece sobre metadados externos.
  - id: R003
    description: Em caso de duas classificações materialmente plausíveis, devolver REVIEW.
  - id: R004
    description: Valores não observáveis devem permanecer null.
  - id: R005
    description: ERROR é reservado a falhas técnicas ou impossibilidade de leitura.
